<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Complaint | CivicMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dashboard-body">
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon">CM</div>
        <div>
          <h3>CivicMind</h3>
          <p>Citizen Portal</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="citizen-dashboard.html">Dashboard</a>
        <a class="active" href="report-complaint.html">Report Complaint</a>
        <a href="my-complaints.html">My Complaints</a>
        <a href="analytics.html">Analytics</a>
        <a href="index.html">Logout</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <div class="topbar">
        <div>
          <h1>Report a Grievance</h1>
          <p>Submit a public grievance for smart routing and resolution</p>
        </div>
      </div>

      <div class="form-card">
        <form class="grievance-form" id="grievanceForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="title">Complaint Title</label>
              <input id="title" type="text" placeholder="e.g., Streetlight not working near bus stand" required />
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="">Select Category</option>
                <option>Water Supply</option>
                <option>Sanitation</option>
                <option>Electrical</option>
                <option>Road Damage</option>
                <option>Drainage</option>
                <option>Public Safety</option>
                <option>Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="area">Area / Ward</label>
              <input id="area" type="text" placeholder="Enter ward or locality" required />
            </div>

            <div class="form-group">
              <label for="severity">Severity</label>
              <select id="severity" required>
                <option value="">Select Severity</option>
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
                <option>Critical</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label for="description">Description</label>
              <textarea id="description" rows="6" placeholder="Describe the issue in detail..." required></textarea>
            </div>

            <div class="form-group">
              <label for="landmark">Landmark</label>
              <input id="landmark" type="text" placeholder="Nearby landmark" />
            </div>

            <div class="form-group">
              <label for="image">Upload Image</label>
              <input id="image" type="file" />
            </div>
          <input type=""hidden" id="latitude">
          <input type=""hidden" id="longitude">


          <div class="form-actions">

            <input type="hidden" id ="latitude">
            <input type=""hidden" id = "logitude">
            
            <button type="submit" class="primary-btn">Submit Complaint</button>
            <button type="reset" class="secondary-btn">Reset</button>
          </div>

          <p id="formMessage" style="margin-top:14px;font-weight:600;"></p>
        </form>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
